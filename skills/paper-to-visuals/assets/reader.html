<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__PAGE_TITLE__</title>
  <style>
    :root{--ink:#132f3d;--muted:#667b84;--line:#dce6e5;--paper:#f6f8f5;--teal:#147b74;--teal-light:#e7f4ee;--white:#fff;--shadow:0 18px 60px #102d3e16}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7}
    button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}a{color:var(--teal);text-underline-offset:4px}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #e7a346;outline-offset:4px}
    .shell{max-width:1280px;margin:auto;padding:32px 40px 48px}.masthead{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:22px;border-bottom:1px solid var(--line)}
    .brand{font-size:13px;letter-spacing:.12em;font-weight:700}.brand::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--teal);margin-right:9px}
    .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.button{border:1px solid var(--line);border-radius:10px;background:var(--white);color:var(--ink);padding:8px 15px;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px}
    .button.primary{background:var(--ink);color:white;border-color:var(--ink)}.button:hover{border-color:var(--teal)}.button:disabled{opacity:.35;cursor:default}
    .hero{padding:32px 0 25px;display:grid;grid-template-columns:minmax(0,1fr) 275px;gap:40px;align-items:end}.eyebrow{color:var(--teal);font-size:12px;font-weight:700;letter-spacing:.1em;margin:0 0 8px}
    h1{font-size:clamp(26px,3.4vw,40px);line-height:1.3;letter-spacing:-.03em;margin:0 0 10px;font-weight:760}.subtitle{color:var(--muted);font-size:13px;margin:0 0 12px}.summary{font-size:16px;max-width:780px;margin:0}
    .route{padding:20px 22px;border-left:2px solid #aec8c0}.route strong{display:block;font-size:14px;margin-bottom:5px}.route span{font-size:13px;color:var(--muted)}.scope{border:1px solid #dbe6dc;background:#edf3e9;padding:11px 16px;border-radius:10px;font-size:12px;color:#526652;margin-bottom:24px}
    .index-head{display:flex;align-items:baseline;justify-content:space-between;gap:15px;margin:25px 0 15px}.index-head h2{font-size:17px;margin:0}.index-head p{font-size:12px;color:var(--muted);margin:0}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.chapter{appearance:none;text-align:left;background:white;color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;min-width:0;transition:transform .18s,border-color .18s,box-shadow .18s}
    .chapter:hover{transform:translateY(-3px);border-color:#8db8af;box-shadow:var(--shadow)}.chapter-top{display:flex;align-items:center;justify-content:space-between;gap:7px}.num{font-variant-numeric:tabular-nums;font-size:19px;line-height:1;font-weight:750;color:var(--teal)}.category{font-size:10px;color:var(--muted);text-align:right}
    .mini{height:97px;display:flex;align-items:center;justify-content:center;margin:14px -2px 8px;overflow:hidden;border-radius:10px;background:#f5f8f7}.mini img{display:block;width:100%;height:100%;object-fit:contain}.mini-fallback{color:var(--muted);font-size:13px}
    .chapter h3{font-size:17px;line-height:1.4;margin:6px 0 5px}.chapter p{font-size:12px;line-height:1.65;color:var(--muted);margin:0;flex:1}.chapter-end{margin-top:13px;display:flex;align-items:center;justify-content:space-between;color:var(--teal);font-size:11px}
    .foot{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:20px;margin-top:28px;border-top:1px solid var(--line);padding-top:18px}
    dialog{border:1px solid #ccd9d6;border-radius:20px;padding:0;width:min(1150px,calc(100% - 36px));max-width:none;height:min(900px,92dvh);max-height:92dvh;background:#fff;color:var(--ink);box-shadow:0 25px 100px #071e2855}
    dialog::backdrop{background:#18333f99;backdrop-filter:blur(5px)}.dialog-layout{height:100%;display:flex;flex-direction:column;overflow:hidden}.dialog-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding:20px 26px 17px;border-bottom:1px solid var(--line);flex:none;background:#fafcfb}
    .dialog-kicker{font-size:11px;color:var(--teal);font-weight:700;margin-bottom:5px}.dialog-head h2{font-size:24px;line-height:1.4;margin:0}.close{flex:none;width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:white;font-size:24px;line-height:1}
    .dialog-scroll{overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0;padding:22px 26px 32px}.lead{margin:0 0 22px;font-size:15px;color:#47636b}.detail-figure{margin:0 0 24px;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#f9fbfa}.figure-bar{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:10px 14px;background:#f0f6f3;font-size:12px;color:var(--muted)}
    .figure-bar button{border:0;background:none;color:var(--teal);font-size:12px;padding:5px 8px}.figure-media{overflow:auto;background:white}.figure-media img{display:block;width:100%;height:auto}.figure-media.zoomed{max-height:65vh}.figure-media.zoomed img{width:1400px;min-width:100%;max-width:none}figcaption{padding:10px 14px;font-size:12px;color:var(--muted);line-height:1.6}
    .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{padding:17px 20px;background:#f5f8f6;border-radius:12px;min-width:0}.field h3{font-size:14px;margin:0 0 8px}.field p,.field li{font-size:13px;color:#4c646b;line-height:1.85}.field p{margin:5px 0}.field ul{margin:0;padding-left:18px}
    details{border:1px solid var(--line);border-radius:12px;margin-top:20px;padding:16px 20px}summary{cursor:pointer;font-size:14px;font-weight:650}.prose{font-size:14px;line-height:1.95;max-width:850px}.prose p{margin:15px 0 0;white-space:pre-line}.sources{margin-top:20px;display:flex;flex-wrap:wrap;gap:7px 18px;font-size:12px}.sources .source-label{color:var(--muted)}
    .dialog-foot{border-top:1px solid var(--line);padding:13px 26px;display:flex;align-items:center;justify-content:space-between;gap:15px;flex:none;background:#fafcfb}.position{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
    body.modal-open{overflow:hidden}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:1050px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{grid-template-columns:1fr}.route{display:none}}
    @media(max-width:760px){.shell{padding:22px 22px 35px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.hero{padding:27px 0 20px}.chapter{padding:14px}.category{font-size:9px}.chapter h3{font-size:16px}.scope{margin-bottom:18px}.masthead{align-items:flex-start}.brand{font-size:11px}.actions .button{font-size:11px;padding:7px 11px}.dialog-head,.dialog-scroll{padding-left:18px;padding-right:18px}.dialog-head h2{font-size:21px}.dialog-foot{padding:12px 16px}.fields{grid-template-columns:1fr}.foot{flex-direction:column;gap:5px}}
    @media(max-width:420px){.shell{padding:16px}.grid{grid-template-columns:1fr}.chapter{display:grid;grid-template-columns:1fr 105px;gap:4px 12px}.chapter-top{grid-column:1/3}.mini{grid-column:2;grid-row:2/5;width:105px;height:100%;min-height:95px;margin:4px 0 0}.chapter h3,.chapter p,.chapter-end{grid-column:1}.chapter-end{margin-top:7px}.index-head{align-items:flex-start;flex-direction:column;gap:3px}.dialog-foot .button{font-size:12px;padding:7px 11px}.position{font-size:11px}.masthead{gap:8px}.scope{font-size:11px}dialog{width:calc(100% - 16px);border-radius:14px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.chapter{transition:none}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="masthead"><div class="brand">论文交互图解</div><div class="actions"><button class="button primary" id="download-md">下载讲解稿 .md <span aria-hidden="true">↓</span></button></div></header>
    <main>
      <section class="hero"><div><p class="eyebrow" id="kicker"></p><h1 id="paper-title"></h1><p class="subtitle" id="subtitle"></p><p class="summary" id="paper-summary"></p></div><aside class="route"><strong>先看全篇，再展开细节</strong><span>点击编号章节进入图解<br>连续讲解与出处收录于 Markdown</span></aside></section>
      <div class="scope" id="scope"></div>
      <div class="index-head"><h2>全篇导航 <span id="chapter-count"></span></h2><p>每一章，都可以点击展开</p></div>
      <div class="grid" id="chapters"></div>
    </main>
    <footer class="foot"><span>图解建立直觉 · 讲解连接推理 · 来源保留边界</span><span id="footer-scope"></span></footer>
  </div>
  <dialog id="detail-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-lead">
    <div class="dialog-layout">
      <header class="dialog-head"><div><div id="dialog-kicker" class="dialog-kicker"></div><h2 id="dialog-title"></h2></div><button class="close" id="close-dialog" aria-label="关闭章节" autofocus>×</button></header>
      <div class="dialog-scroll" id="dialog-scroll"><p class="lead" id="dialog-lead"></p><div id="dialog-content"></div></div>
      <footer class="dialog-foot"><button class="button" id="previous">← 上一章</button><span class="position" id="position" aria-live="polite"></span><button class="button" id="next">下一章 →</button></footer>
    </div>
  </dialog>
  <noscript>此导览需要启用浏览器 JavaScript。配套的论文讲解.md 可独立阅读。</noscript>
  <script id="reader-data" type="application/json">__READER_DATA__</script>
  <script>
    "use strict";
    const data=JSON.parse(document.getElementById("reader-data").textContent);
    const $=id=>document.getElementById(id);
    const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const dialog=$("detail-dialog");let active=-1;let returnTarget=null;let restoring=false;
    $("kicker").textContent=data.kicker||"论文图解";
    $("paper-title").textContent=data.title;$("subtitle").textContent=data.subtitle||"";
    $("paper-summary").textContent=data.summary;$("scope").textContent=data.scope;
    $("chapter-count").textContent=` / ${data.chapters.length} 章`;
    $("footer-scope").textContent=data.footer||"可离线阅读";
    $("chapters").innerHTML=data.chapters.map((c,i)=>`<button type="button" class="chapter" data-index="${i}" id="card-${esc(c.id)}" aria-haspopup="dialog" aria-label="${esc(c.id+' '+c.title)}"><div class="chapter-top"><span class="num">${esc(c.id)}</span><span class="category">${esc(c.category)}</span></div><div class="mini">${c.overview?`<img src="${esc(c.overview.src)}" alt="${esc(c.overview.alt)}">`:`<span class="mini-fallback">${esc(c.status||"待补充")}</span>`}</div><h3>${esc(c.title)}</h3><p>${esc(c.summary)}</p><span class="chapter-end">展开图解 <span aria-hidden="true">↗</span></span></button>`).join("");
    function renderChapter(index){
      active=index;const c=data.chapters[index];
      $("dialog-kicker").textContent=`${c.category} · ${c.id}`;
      $("dialog-title").textContent=`${c.id} ${c.title}`;
      $("dialog-lead").textContent=c.summary;
      const figures=(c.figures||[]).map((f,i)=>`<figure class="detail-figure"><div class="figure-bar"><span>图解 ${i+1}</span><button type="button" data-zoom="${i}" aria-pressed="false" aria-label="放大图解 ${i+1}">放大图解 ↗</button></div><div class="figure-media" id="figure-${i}"><img src="${esc(f.src)}" alt="${esc(f.alt)}"></div>${f.caption?`<figcaption>${esc(f.caption)}</figcaption>`:""}</figure>`).join("");
      const fields=(c.sections||[]).map(s=>`<section class="field"><h3>${esc(s.heading)}</h3>${(s.paragraphs||[]).map(p=>`<p>${esc(p)}</p>`).join("")}${s.items?.length?`<ul>${s.items.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`:""}</section>`).join("");
      const prose=(c.explanation||[]).map(p=>`<p>${esc(p)}</p>`).join("");
      const sources=(c.sources||[]).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)} ↗</a>`).join("");
      $("dialog-content").innerHTML=figures+`<div class="fields">${fields}</div>`+(prose?`<details><summary>阅读本章完整讲解</summary><div class="prose">${prose}</div></details>`:"")+(sources?`<div class="sources"><span class="source-label">依据</span>${sources}</div>`:"");
      $("previous").disabled=index===0;$("next").disabled=index===data.chapters.length-1;
      $("position").textContent=`${c.id} / ${String(data.chapters.length).padStart(2,"0")}`;
      $("dialog-scroll").scrollTop=0;
    }
    function setHash(id){try{history.replaceState(null,"",location.pathname+location.search+(id?"#chapter-"+id:""));}catch(_){/* Local file modes may limit history changes; the reader still works. */}}
    function openChapter(index,fromHash=false){
      if(index<0||index>=data.chapters.length)return;
      if(!dialog.open)returnTarget=document.activeElement;
      renderChapter(index);if(!dialog.open)dialog.showModal();
      document.body.classList.add("modal-open");
      if(!fromHash)setHash(data.chapters[index].id);
    }
    $("chapters").addEventListener("click",event=>{const card=event.target.closest("[data-index]");if(card)openChapter(Number(card.dataset.index));});
    $("close-dialog").addEventListener("click",()=>dialog.close());
    $("previous").addEventListener("click",()=>openChapter(active-1));
    $("next").addEventListener("click",()=>openChapter(active+1));
    dialog.addEventListener("close",()=>{
      document.body.classList.remove("modal-open");if(!restoring)setHash(null);restoring=false;
      const target=returnTarget?.isConnected&&returnTarget!==document.body?returnTarget:$("card-"+data.chapters[Math.max(active,0)].id);
      target?.focus({preventScroll:true});
    });
    dialog.addEventListener("click",event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();}});
    $("dialog-content").addEventListener("click",event=>{
      const button=event.target.closest("[data-zoom]");if(!button)return;
      const zoomed=$("figure-"+button.dataset.zoom).classList.toggle("zoomed");
      button.setAttribute("aria-pressed",String(zoomed));button.textContent=zoomed?"还原图解 ↙":"放大图解 ↗";
      button.setAttribute("aria-label",(zoomed?"还原图解 ":"放大图解 ")+(Number(button.dataset.zoom)+1));
    });
    $("download-md").addEventListener("click",()=>{
      const blob=new Blob([data.markdown],{type:"text/markdown;charset=utf-8"});const url=URL.createObjectURL(blob);
      const a=document.createElement("a");a.href=url;a.download=data.markdown_name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
    });
    function readHash(){
      const id=location.hash.startsWith("#chapter-")?location.hash.slice(9):"";
      const index=data.chapters.findIndex(c=>c.id===id);
      if(index>=0)openChapter(index,true);else if(dialog.open){restoring=true;dialog.close();}
    }
    window.addEventListener("hashchange",readHash);readHash();
  </script>
</body>
</html>
